<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BNITZ — The layout of ideas">
  <meta name="theme-color" content="#ffffff">
  <title>BNITZ</title>
  <link rel="icon" type="image/svg+xml" href="/assets/problem.svg?v=0.0.4">
  <link rel="stylesheet" href="/bnitz.css?v=0.0.4">
  <link rel="stylesheet" href="/reader.css?v=0.0.3">
  <link rel="preload" as="image" href="/assets/problem.svg?v=0.0.4">
  <link rel="preload" as="image" href="/assets/background.svg?v=0.0.4">
  <link rel="preload" as="image" href="/assets/method.svg?v=0.0.4">
  <link rel="preload" as="image" href="/assets/implication.svg?v=0.0.4">
  <link rel="preload" as="image" href="/assets/evidence.svg?v=0.0.4">
  <link rel="preload" as="image" href="/assets/scope.svg?v=0.0.4">
  <script defer src="/vendor/katex.min.js"></script>
  <script defer src="/CORE/model.js"></script>
  <script defer src="/CORE/view.js"></script>
  <script defer src="/reader.js?v=0.0.5"></script>
</head>
<body>
  <header class="sidebar">
    <a class="wordmark" href="#" aria-label="BNITZ home"><span>BNITZ</span></a>
    <p class="tagline">The layout of ideas</p>
  </header>
  <main id="content" tabindex="-1">
    <p id="status" class="status" role="status" hidden></p>
    <section id="readings" aria-label="Readings">
      <div id="papers" class="readings-list"></div>
      <footer class="reader-footer">
        <a href="https://github.com/enricobottazzi/bnitz" target="_blank" rel="noopener noreferrer" aria-label="BNITZ on GitHub">
          <!-- GitHub Invertocat from https://brand.github.com/foundations/logo -->
          <img src="/assets/github.svg" alt="" width="14" height="14">
        </a>
      </footer>
    </section>
    <section id="reading" class="article-reader" aria-labelledby="title" hidden>
      <header class="reader-heading">
        <h1 id="title" tabindex="-1"></h1>
        <p id="metadata"></p>
      </header>
      <div class="reader-grid">
        <article id="abstract" class="reader-text" aria-label="Abstract" tabindex="0"></article>
        <div class="reader-layout">
          <div id="map" class="map map-pane" aria-label="BNITZ language map"></div>
          <details class="reader-legend">
            <summary>Legend</summary>
            <div id="legend" class="reader-legend-panel"></div>
          </details>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
