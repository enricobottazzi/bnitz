<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BNITZ — A visual notation for scientific arguments">
  <meta name="theme-color" content="#ffffff">
  <title>BNITZ</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/reader.css?v=0.0.44">
  <link rel="preload" as="image" href="/assets/core.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/problem.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/background.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/method.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/implication.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/evidence.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/scope.svg?v=0.0.6">
  <script defer src="/vendor/katex.min.js"></script>
  <script defer src="/lang/model.js?v=0.0.13"></script>
  <script defer src="/lang/view.js?v=0.0.14"></script>
  <script defer src="/playground.js?v=1"></script>
  <script defer src="/reader.js?v=0.0.37"></script>
</head>
<body>
  <header class="sidebar">
    <a class="wordmark" href="#" aria-label="BNITZ home"><span>BNITZ</span></a>
    <p class="tagline">A visual notation for scientific arguments</p>
    <div class="reader-links">
      <a id="about-link" href="#about" aria-label="About BNITZ">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="7.5" r="1.25" fill="currentColor"/>
          <path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </a>
      <a id="playground-link" href="#playground" aria-label="Playground">
        <img src="/assets/orbit.svg?v=2" alt="" width="16" height="16">
      </a>
      <a href="mailto:nrcbtz@gmail.com?subject=BNITZ%20Chrome%20extension%20beta%20access&amp;body=Hi%20Enrico%2C%0D%0A%0D%0AI%27d%20like%20to%20beta%20test%20the%20BNITZ%20Chrome%20extension.%20Could%20you%20give%20me%20access%3F"
         aria-label="Request beta access to the BNITZ Chrome extension by email">
        <img src="/assets/chrome.svg?v=2" alt="" width="16" height="16">
      </a>
      <a href="https://github.com/enricobottazzi/bnitz" target="_blank" rel="noopener noreferrer" aria-label="BNITZ on GitHub">
        <!-- GitHub Invertocat from https://brand.github.com/foundations/logo -->
        <img src="/assets/github.svg?v=2" alt="" width="16" height="16">
      </a>
    </div>
  </header>
  <main id="content" tabindex="-1">
    <p id="status" class="status" role="status" hidden></p>
    <form id="arxiv-import" aria-label="Import from arXiv" novalidate hidden>
      <input id="arxiv-url" aria-label="arXiv abstract URL" placeholder="Enter an arXiv abstract link (https://arxiv.org/abs/...)" inputmode="url" enterkeyhint="go" autocapitalize="none" spellcheck="false" required>
      <p class="status" role="status"></p>
    </form>
    <section id="readings" aria-label="Readings">
      <div id="papers" class="readings-list"></div>
    </section>
    <section id="reading" class="article-reader" aria-labelledby="title" hidden>
      <header class="reader-heading">
        <h1 id="title" tabindex="-1"></h1>
        <p id="metadata"></p>
      </header>
      <div class="reader-grid">
        <article id="abstract" class="reader-text" aria-label="Abstract" tabindex="0"></article>
        <div class="map-column">
          <div id="map" class="map map-pane" aria-label="BNITZ language map">
            <button type="button" id="new-core" aria-label="Add core" hidden><img src="/assets/core.svg" alt="" width="40" height="40"></button>
          </div>
          <div id="planet-editor" class="icon-actions" role="group" aria-label="Map editing" hidden>
            <button type="button" id="add-planet" aria-label="Add planet" aria-haspopup="menu" popovertarget="planet-menu" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
            </button>
            <div id="planet-menu" popover role="menu" aria-label="Planet type"></div>
            <button type="button" id="remove-planet" aria-label="Delete planet" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg>
            </button>
            <button type="button" id="undo-planet" aria-label="Undo last map edit" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-6 6 6 6M3 9h11a6 6 0 0 1 0 12"/></svg>
            </button>
            <button type="button" id="export-document" aria-label="Export .bnitz">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg>
            </button>
          </div>
          <p id="document-status" class="status" role="status"></p>
        </div>
        <details class="reader-legend">
          <summary>Legend</summary>
          <div id="legend" class="reader-legend-panel"></div>
        </details>
      </div>
    </section>
  </main>
</body>
</html>
