<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BNITZ — The notation of scientific arguments">
  <meta name="theme-color" content="#ffffff">
  <title>BNITZ</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/bnitz.css?v=0.0.9">
  <link rel="stylesheet" href="/reader.css?v=0.0.23">
  <link rel="preload" as="image" href="/assets/core.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/problem.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/background.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/method.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/implication.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/evidence.svg?v=0.0.6">
  <link rel="preload" as="image" href="/assets/scope.svg?v=0.0.6">
  <script defer src="/vendor/katex.min.js"></script>
  <script defer src="/lang/model.js?v=0.0.12"></script>
  <script defer src="/lang/view.js?v=0.0.13"></script>
  <script defer src="/reader.js?v=0.0.21"></script>
</head>
<body>
  <header class="sidebar">
    <a class="wordmark" href="#" aria-label="BNITZ home"><span>BNITZ</span></a>
    <p class="tagline">The notation of scientific arguments</p>
    <div class="reader-links">
      <a id="about-link" href="#about" aria-label="About BNITZ">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="7.5" r="1.25" fill="currentColor"/>
          <path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </a>
      <a id="playground-link" href="#playground" aria-label="Playground">
        <img src="/assets/orbit.svg" alt="" width="16" height="16">
      </a>
      <a href="mailto:nrcbtz@gmail.com?subject=BNITZ%20Chrome%20extension%20beta%20access&amp;body=Hi%20Enrico%2C%0D%0A%0D%0AI%27d%20like%20to%20beta%20test%20the%20BNITZ%20Chrome%20extension.%20Could%20you%20give%20me%20access%3F"
         aria-label="Request beta access to the BNITZ Chrome extension by email">
        <img src="/assets/chrome.svg" alt="" width="16" height="16">
      </a>
      <a href="https://github.com/enricobottazzi/bnitz" target="_blank" rel="noopener noreferrer" aria-label="BNITZ on GitHub">
        <!-- GitHub Invertocat from https://brand.github.com/foundations/logo -->
        <img src="/assets/github.svg" alt="" width="16" height="16">
      </a>
    </div>
  </header>
  <main id="content" tabindex="-1">
    <p id="status" class="status" role="status" hidden></p>
    <section id="readings" aria-label="Readings">
      <div id="papers" class="readings-list"></div>
    </section>
    <section id="reading" class="article-reader" aria-labelledby="title" hidden>
      <header class="reader-heading">
        <h1 id="title" tabindex="-1"></h1>
        <p id="metadata"></p>
      </header>
      <div id="playground-tools" hidden>
        <div class="actions">
          <button type="button" id="import-document">Import .bnitz</button>
          <input type="file" id="document-file" accept=".bnitz,application/json" hidden>
          <button type="button" id="export-document">Export .bnitz</button>
          <button type="button" id="reset-document">Start fresh</button>
        </div>
        <p id="document-status" class="status" role="status"></p>
        <details id="document-details">
          <summary>Text &amp; details</summary>
          <form id="document-fields">
            <label class="document-wide">Title<input id="document-title" name="title" placeholder="Title" required></label>
            <label>Author<input id="document-author" name="author" placeholder="Author"></label>
            <label>Year<input id="document-year" name="year" placeholder="Year" type="number" min="1" max="9999" step="1"></label>
            <label class="document-wide">Source<input id="document-source" name="source" placeholder="https://…" type="url"></label>
            <label class="document-wide">Text<textarea id="document-text" name="text" placeholder="Paste your text here" rows="8" required></textarea></label>
          </form>
        </details>
      </div>
      <form id="planet-editor" aria-label="Playground" hidden>
        <div class="actions">
          <button type="button" id="add-planet">Add planet</button>
          <button type="button" id="remove-planet" disabled>Remove planet</button>
          <button type="button" id="edit-planet" disabled>Edit planet</button>
          <p id="editor-status" role="status"></p>
        </div>
        <div class="actions">
          <button type="button" id="add-highlight" disabled>Highlight</button>
          <button type="button" id="clear-highlights" disabled>Clear highlights</button>
          <span id="highlight-hint">Select text.</span>
        </div>
        <div class="planet-settings">
          <select id="relation" aria-label="Planet type" required disabled></select>
          <select id="parent" aria-label="Attaches to" required disabled></select>
          <button type="submit" id="save-planet" class="primary" disabled>Save</button>
          <button type="button" id="cancel-planet" disabled>Cancel</button>
        </div>
      </form>
      <div class="reader-grid">
        <article id="abstract" class="reader-text" aria-label="Abstract" tabindex="0"></article>
        <div id="map" class="map map-pane" aria-label="BNITZ language map"></div>
        <details class="reader-legend">
          <summary>Legend</summary>
          <div class="reader-legend-panel">
            <div id="legend"></div>
            <a href="https://github.com/enricobottazzi/bnitz/blob/main/RULES.md" target="_blank" rel="noopener noreferrer">RULES.md</a>
          </div>
        </details>
      </div>
    </section>
  </main>
</body>
</html>
